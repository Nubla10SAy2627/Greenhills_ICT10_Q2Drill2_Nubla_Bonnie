<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List in Python</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h1>Sapphire Student Checker</h1>
    <p>Student Verification System</p>
    <form>
        <input type="text" id="firstname" placeholder="Enter your first name"><br>
        <input type="text" id="lastname" placeholder="Enter your last name"><br>
        <input type="button" py-click="name_finder" value="Search"><br>
    </form>

    <div id="result"></div>
    <py-script src="main.py"></py-script>
</body>
</html>
